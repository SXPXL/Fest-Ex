<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fest Expense Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg: #121212; --surface: #1e1e1e; --primary: #bb86fc;
            --secondary: #03dac6; --error: #cf6679; --text: #e0e0e0;
            --text-muted: #a0a0a0; --border: #333;
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding-bottom: 80px; }
        .hidden { display: none !important; }
        .flex { display: flex; align-items: center; }
        .justify-between { justify-content: space-between; }
        .card { background: var(--surface); padding: 15px; margin: 15px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        h2, h3, h4 { margin-top: 0; color: var(--primary); }
        
        /* Nav */
        nav { background: var(--surface); padding: 15px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border); }
        .nav-drawer { position: fixed; top: 0; left: -250px; width: 250px; height: 100%; background: var(--surface); z-index: 200; transition: 0.3s; border-right: 1px solid var(--border); padding-top: 60px; }
        .nav-drawer.open { left: 0; }
        .nav-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 150; display: none; }
        .nav-item { padding: 15px 20px; border-bottom: 1px solid var(--border); cursor: pointer; display: block; color: var(--text); }

        /* Forms */
        input, select { background: #2c2c2c; border: 1px solid var(--border); color: white; padding: 12px; width: 100%; border-radius: 8px; margin-bottom: 10px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; border: none; border-radius: 8px; background: var(--primary); color: #000; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button.secondary { background: var(--secondary); }
        .user-select-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); }
        .amount-manual { width: 80px; margin: 0; text-align: right; }

        /* Heatmap (UPDATED LARGER SIZE) */
        .heatmap-scroll-wrapper { 
            overflow-x: auto; 
            padding-bottom: 10px; 
            width: 100%; 
            display: flex; /* Centers content if not overflowing */
        }
        .heatmap-months-container { 
            display: flex; 
            gap: 8px; 
            width: max-content; 
            padding-right: 25px; 
        }
        .month-block { display: flex; flex-direction: column; }
        .month-label { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 6px; height: 15px; }
        .month-grid { display: grid; grid-template-rows: repeat(7, 15px); grid-auto-flow: column; gap: 4px; }
        .heatmap-box { width: 15px; height: 15px; border-radius: 3px; background: #2c2c2c; cursor: pointer; transition: all 0.1s; }
        .heatmap-box.empty { background: transparent; cursor: default; }
        .heatmap-box:not(.empty):hover { transform: scale(1.3); border: 1px solid white; z-index: 10; }
        
        .level-0 { background: #2c2c2c; } .level-1 { background: #0e4429; } .level-2 { background: #006d32; } .level-3 { background: #26a641; } .level-4 { background: #39d353; }
        #heatmap-tooltip { position: fixed; background: rgba(0,0,0,0.9); color: white; padding: 5px; border-radius: 4px; font-size: 0.8rem; pointer-events: none; border: 1px solid #444; z-index: 1000; display: none; }

        /* Tabs & Modal */
        .date-tabs { display: flex; overflow-x: auto; gap: 10px; margin-bottom: 15px; }
        .date-tab { padding: 8px 16px; background: #333; border-radius: 20px; white-space: nowrap; cursor: pointer; font-size: 0.9rem; }
        .date-tab.active { background: var(--secondary); color: black; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 200; display: flex; justify-content: center; align-items: center; }
    </style>
</head>
<body>
    <nav>
        <div class="menu-btn" onclick="toggleMenu()"><i class="fas fa-bars"></i></div>
        <div style="font-weight:bold;">FestTracker</div>
        <div></div>
    </nav>
    <div class="nav-overlay" onclick="toggleMenu()"></div>
    <div class="nav-drawer" id="drawer">
        <a class="nav-item" onclick="showPage('home')">Home</a>
        <a class="nav-item" onclick="showPage('create-event')">New Fest</a>
        <a class="nav-item" onclick="showPage('analytics')">Analytics</a>
        <a class="nav-item" onclick="toggleAdminLogin()" id="admin-btn">Login</a>
    </div>

    <div id="page-home">
        <div id="add-fest-card" class="card" onclick="showPage('create-event')" style="text-align:center; border: 2px dashed #444; cursor:pointer;">+ Add New Fest</div>
        <div id="active-fests-list"></div>
    </div>

    <div id="page-create-event" class="hidden">
        <div class="card">
            <h2>New Fest Setup</h2>
            <input type="text" id="festName" placeholder="Fest Name">
            <label>Start</label><input type="date" id="festStartDate">
            <label>End</label><input type="date" id="festEndDate">
            
            <div style="margin-top:20px; border-top:1px solid #333; padding-top:10px;">
                <label style="color:var(--primary);">Who is coming?</label>
                <div class="flex" style="margin-top:10px;">
                    <input type="text" id="newFriendName" placeholder="Name" style="margin:0; border-radius:8px 0 0 8px;">
                    <button onclick="addNewGlobalUser()" style="width:auto; margin:0; border-radius:0 8px 8px 0;"><i class="fas fa-plus"></i></button>
                </div>
                <div id="user-selection-list" style="max-height:150px; overflow-y:auto; margin-top:10px; border:1px solid #333; border-radius:8px;"></div>
            </div>
            <button onclick="saveFestSetup()" style="margin-top:20px;">Create Fest</button>
            <button class="secondary" onclick="showPage('home')">Cancel</button>
        </div>
    </div>

    <div id="page-fest-details" class="hidden">
        <div style="background: var(--surface); padding: 15px 15px 0 15px; position:sticky; top:60px; z-index:90;">
            <div class="flex justify-between" style="margin-bottom:10px;">
                <h3 id="fest-details-title" style="margin:0;">Fest Name</h3>
                <div>
                    <button onclick="showSettlementModal()" style="width:auto; padding:5px 10px; margin-right:5px; background: #03dac6; color: black;"><i class="fas fa-file-invoice-dollar"></i> Settle</button>
                    <button class="secondary" onclick="showPage('home')" style="width:auto; padding:5px 10px; margin:0;"><i class="fas fa-arrow-left"></i></button>
                </div>
            </div>
            <div class="date-tabs" id="fest-date-tabs"></div>
        </div>

        <div id="view-fest-list">
            <div id="expense-list-container" style="padding-bottom: 80px;"></div>
            <button id="add-expense-btn" onclick="showAddExpenseForm()" style="position: fixed; bottom: 20px; right: 20px; width: 60px; height: 60px; border-radius: 50%; font-size: 24px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); z-index:100;"><i class="fas fa-plus"></i></button>
        </div>

        <div id="view-add-expense" class="hidden">
            <div class="card" style="margin-top:0;">
                <div class="flex justify-between">
                    <h3 id="expense-form-title">New Expense</h3>
                    <div onclick="hideAddExpenseForm()" style="padding:10px; cursor:pointer;"><i class="fas fa-times"></i></div>
                </div>
                <input type="text" id="expTitle" placeholder="Title">
                <input type="number" id="expAmount" placeholder="Amount (₹)">
                
                <h4>Who Paid?</h4>
                <div id="payer-selection-area"></div>
                <h4>Split</h4>
                <div class="flex" style="margin-bottom:10px;">
                    <input type="checkbox" id="splitEquallyCheck" checked onchange="toggleSplitMode()" style="width:20px; margin:0;">
                    <label for="splitEquallyCheck" style="margin-left:10px;">Split Equally</label>
                </div>
                <div id="split-selection-area" class="hidden"></div>
                <button onclick="submitTransaction()">Save Transaction</button>
            </div>
        </div>
    </div>

    <div id="settlement-modal" class="modal-overlay hidden">
        <div class="card" style="width: 90%; max-width: 400px; max-height: 80vh; overflow-y: auto;">
            <div class="flex justify-between" style="border-bottom: 1px solid #333; padding-bottom: 10px;">
                <h3>Settlement</h3>
                <i class="fas fa-times" onclick="closeSettlementModal()" style="cursor:pointer;"></i>
            </div>
            <div id="fest-settlement-plan" style="margin-top:10px;"></div>
        </div>
    </div>

    <div id="page-analytics" class="hidden">
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px; padding:15px;">
            <div class="card" style="margin:0; text-align:center;"><small>Total</small><h2 id="stat-total">₹0</h2></div>
            <div class="card" style="margin:0; text-align:center;"><small>Top Payer</small><h4 id="stat-whale">-</h4></div>
        </div>
        <div class="card">
            <h3>Spending</h3>
            <div style="height: 250px; position: relative;"><canvas id="spendChart"></canvas></div>
        </div>
        <div class="card">
            <h3>Activity Heatmap</h3>
            <div class="heatmap-scroll-wrapper"><div class="heatmap-months-container" id="calendar-months-container"></div></div>
            <div class="flex" style="justify-content: flex-end; gap: 4px; font-size:0.7rem; margin-top:5px;">
                <span>Less</span><div class="heatmap-box level-0"></div><div class="heatmap-box level-2"></div><div class="heatmap-box level-4"></div><span>More</span>
            </div>
        </div>
        <div id="heatmap-tooltip"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
